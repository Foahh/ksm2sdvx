[build-system]
requires = ["scikit-build-core>=1.0.3,<1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ksm2sdvx"
version = "0.1.0"
description = "KSM to SDVX conversion tools"
readme = "README.md"
requires-python = ">=3.14"
license-files = ["LICENSES/*.txt"]
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.11.2,<6.12", "PySide6-Fluent-Widgets>=1.11,<2"]

[project.gui-scripts]
ksm2sdvx-gui = "ksm2sdvx.ui:main"

[project.scripts]
ksm2sdvx = "ksm2sdvx.cli:main"

[dependency-groups]
dev = ["hypothesis", "pyright", "pytest", "pytest-cov", "ruff"]

[tool.scikit-build]
minimum-version = "1.0"
wheel.packages = ["src/ksm2sdvx"]
wheel.py-api = "py3"
build-dir = "build/{wheel_tag}"
sdist.inclusion-mode = "explicit"
sdist.include = [
    "/pyproject.toml", "/CMakeLists.txt", "/README.md", "/.python-version", "/uv.lock",
    "/LICENSES/**", "/src/**", "/native/**", "/tests/**", "/scripts/**", "/typings/**", "/docs/*.md", "/examples/**",
    "/external/ksm-v2/LICENSE",
    "/external/ksm-v2/ksmaudio/CMakeLists.txt",
    "/external/ksm-v2/ksmaudio/include/**",
    "/external/ksm-v2/ksmaudio/src/AudioEffect/**",
    "/external/ksm-v2/ksmaudio/src/StreamWithEffects.cpp",
    "/external/ksm-v2/ksmaudio/src/Stream.cpp",
    "/external/ksm-v2/ksmaudio/src/Sample.cpp",
    "/external/ksm-v2/ksmaudio/src/ksmaudio.cpp",
    "/external/ksm-v2/ksmaudio/ThirdParty_Windows/**",
    "/external/ksm-v2/ksmaudio/THIRD_PARTY_LICENSE.txt",
    "/external/ksm-v2/kson/LICENSE",
    "/external/ksm-v2/kson/include/kson/third_party/nlohmann/json.hpp",
    "/external/ksm-v2/kshootmania/App/se/note/*.wav",
]
sdist.exclude = ["**/__pycache__/**", "**/*.pyc", "/docs/analysis/**", "/.cache/**", "/build/**"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.coverage.run]
source = ["ksm2sdvx"]

[tool.coverage.report]
show_missing = true
